spring.application.name=healthmate-backend

# MySQL Configuration
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:wellnest}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Mani@1409}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
# Railway provides PORT variable, default to 8080 for local execution
server.port=${PORT:8080}
server.tomcat.max-http-post-size=5MB

# Logging
logging.level.org.springframework.security=DEBUG

# JWT Configuration
app.jwtSecret=${JWT_SECRET:HealthMateSecretKeyForJwtSigningShouldBeLongEnoughToPreventBruteForce2024}
app.jwtExpirationMs=86400000 
# 24 hours

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email

# Mail Configuration (Optional SMTP for production/real email delivery)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:healthmatefitness@gmail.com}
